name: Release

on:
  push:
    branches:
      - "devel"
    paths:
      - 'rockspec/**'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Lua
        uses: leafo/gh-actions-lua@v8

      - name: Install Luarocks
        uses: leafo/gh-actions-luarocks@v4
        with:
          luarocksVersion: "3.9.2"

      - name: Extract release version
        id: release_env
        shell: bash
        run: |
          title="${{ github.event.head_commit.message }}"
          re="^feat: release v*(\S+)"
          if [[ $title =~ $re ]]; then
              v=v${BASH_REMATCH[1]}
              echo "version=$v" >> $GITHUB_OUTPUT
              echo "version_without_v=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
              echo "::error::Commit message must follow format: 'feat: release vX.Y.Z'"
              exit 1
          fi

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_env.outputs.version }}
          release_name: ${{ steps.release_env.outputs.version }}
          draft: false
          prerelease: false

      - name: Publish to LuaRocks
        env:
          LUAROCKS_TOKEN: ${{ secrets.LUAROCKS_TOKEN }}
        run: |
          luarocks install dkjson  # Add any required dependencies
          luarocks upload rockspec/lua-resty-redis-cluster-${{ steps.release_env.outputs.version_without_v }}-0.rockspec \
            --api-key=$LUAROCKS_TOKEN
